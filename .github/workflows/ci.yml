name: CI

on:
    pull_request:
    push:
        branches: [main]

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    quality:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: package.json

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Check
              run: bun run check --pre-push

            - name: Test
              run: bun run test

    lab:
        strategy:
            fail-fast: false
            matrix:
                os: ${{ github.event_name == 'push' && fromJSON('["ubuntu-latest", "macos-latest"]') || fromJSON('["ubuntu-latest"]') }}
        runs-on: ${{ matrix.os }}
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v7

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: package.json

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - uses: actions/cache@v4
              with:
                  path: /tmp/ft-lab/cache/archives
                  key: lab-archives-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/pi/runtime/constants.ts') }}

            - name: Lab scenarios
              run: bun scripts/lab run --all > lab-result.json

            - uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: lab-result-${{ matrix.os }}
                  path: lab-result.json
